# Schulwege von der Haltestelle „Darmstadt Lincoln-Siedlung“ (Tram 1/7/8) zu den weiterführenden Schulen.
# Aufbau wie Entfernungen_der_Schulen_von_der_Freiligrathstr.yml.
# Reihenfolge und id/name wie in schulen_2026-2027.yaml.
# Schulstandorte per OpenStreetMap/Nominatim aus den Anschriften geocodiert
# (Schuldorf Bergstraße: nur Straße „Sandstraße“ bekannt → Straßenmittelpunkt).

meta:
  start:
    haltestelle: Darmstadt Lincoln-Siedlung
    haltestelle_id: "de:06411:24009"
    lat: 49.848125
    lon: 8.646289
    plz: "64285"
    ort: Darmstadt
  berechnet_am: 2026-10-03
  einheiten:
    strecke: km
    dauer: min
  fuss:
    methode: OpenStreetMap-Routing (OSRM, Fußprofil)
    geschwindigkeit_kmh: 4.5
  rad:
    methode: OpenStreetMap-Routing (OSRM, Radprofil)
    geschwindigkeit_kmh: 12.0
  zeit_hinweis: Kindertempo, ohne Ampel-/Steigungszuschläge
  auto:
    methode: OpenStreetMap-Routing (OSRM, Autoprofil)
    min: Fahrzeit bei freier Straße (ohne Verkehr)
    min_berufsverkehr: grobe Schätzung = min × 1,5 (Morgenverkehr ca. 7:15–8:00)
    hinweis: >-
      Reine Fahrzeit ohne Parkplatzsuche/Aussteigen; Start an der Haltestelle
      Lincoln-Siedlung. Vor Schulen oft Halteverbot/Elterntaxi-Zonen beachten.
  oepnv:
    methode: Fahrplanauskunft über Transitous (RMV-/DB-Fahrpläne)
    stichtag: 2026-10-20        # Dienstag (erster Dienstag nach den hessischen Herbstferien)
    ankunft_spaetestens: "07:50"
    hinweis: >-
      Späteste Verbindung mit Ankunft bis 07:50 inkl. Fußwegen ab/zur Haltestelle;
      losgehen = Abfahrt bzw. Abmarsch an der Haltestelle Lincoln-Siedlung.
      Schulbusse/Verstärkerfahrten sind evtl. nicht enthalten – vor der
      Entscheidung in der RMV-App gegenprüfen.
  linien_typen: [tram, bus, s_bahn, regionalbahn]

# Schema je Eintrag:
#   id: str, name: str
#   fuss / rad: {km: float, min: int}
#   auto: {km: float, min: int, min_berufsverkehr: int}
#   oepnv: {dauer_min: int, umstiege: int, losgehen: "HH:MM", ankunft: "HH:MM",
#           linien: [{typ: tram|bus|s_bahn|regionalbahn, linie: str}]}
#          | null (mit oepnv_hinweis), wenn keine sinnvolle Verbindung

