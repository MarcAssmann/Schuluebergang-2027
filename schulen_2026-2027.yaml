    beschreibung: >-
      Unser Einzugsgebiet reicht über den Darmstädter Süden bis nach Mühltal.
      Mit rund 650 Schülerinnen und Schülern sind wir eine überschaubare Schule,
      in der persönliche Begegnungen und ein gutes Miteinander wichtig sind. Als
      Kooperative Gesamtschule vereinen wir alle drei Schulformen – Hauptschule,
      Realschule und Gymnasium – unter einem Dach. So können wir Kinder und
      Jugendliche entsprechend ihrer individuellen Stärken begleiten und ihnen
      unterschiedliche Wege zu einem erfolgreichen Schulabschluss eröffnen. Unser
      Hauptschulzweig führt zum Abschluss nach Klasse 9, der Realschulzweig zum
      mittleren Schulabschluss nach Klasse 10 und ermöglicht bei entsprechender
      Qualifikation den Besuch einer externen gymnasialen Oberstufe. Im
      Gymnasialzweig lernen die Schüler im G9-Bildungsgang bis Klasse 10 und
      besuchen anschließend eine externe gymnasiale Oberstufe. Als Ganztagsschule
      verstehen wir Schule als Lern- und Lebensort. Auch am Nachmittag bieten wir
      Möglichkeiten zur fachlichen Vertiefung, zum selbstständigen Lernen und für
      vielfältige weitere Aktivitäten. Unsere internationale Schulgemeinschaft
      steht für Vielfalt, Offenheit und gemeinsames Lernen. Als „Modellschule für
      Kinderrechte“ und „Smart School“ verbinden wir demokratische Bildung und
      einen zeitgemäßen Umgang mit digitalen Medien.
