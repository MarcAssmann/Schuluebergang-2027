      - Einzugsgebiet über den Darmstädter Süden bis nach Mühltal
      - Mit rund 650 Schülerinnen und Schülern eine überschaubare Schule, in der persönliche Begegnungen und ein gutes Miteinander wichtig sind
      - Als Kooperative Gesamtschule alle drei Schulformen – Hauptschule, Realschule und Gymnasium – unter einem Dach
      - Hauptschulzweig führt zum Abschluss nach Klasse 9, Realschulzweig zum mittleren Schulabschluss nach Klasse 10 (bei entsprechender Qualifikation Besuch einer externen gymnasialen Oberstufe möglich)
